# Para un VPS donde Apache YA usa 80/443 (no iniciar Nginx a la vez).
# sudo htpasswd -c /etc/apache2/.smarthome-htpasswd smarthomeadmin
# sudo a2enmod proxy proxy_http rewrite headers ssl
<VirtualHost *:80>
    ServerName smarthome.votaya.com.mx
    DocumentRoot /var/www/smarthome

    <Directory /var/www/smarthome>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/

    # Proteger la app y la API sin bloquear el ACME challenge de Certbot.
    <LocationMatch "^/(?!\.well-known/acme-challenge/).*">
        AuthType Basic
        AuthName "SmartHome - acceso restringido"
        AuthUserFile /etc/apache2/.smarthome-htpasswd
        Require valid-user
    </LocationMatch>

    ErrorLog ${APACHE_LOG_DIR}/smarthome-error.log
    CustomLog ${APACHE_LOG_DIR}/smarthome-access.log combined
</VirtualHost>
