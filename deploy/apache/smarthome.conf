# Para un VPS donde Apache YA usa 80/443 (no iniciar Nginx a la vez).
# sudo a2enmod proxy proxy_http rewrite headers ssl
<VirtualHost *:80>
    ServerName smarthome.votaya.com.mx
    DocumentRoot /var/www/smarthome

    <Directory /var/www/smarthome>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:8000/api/
    ProxyPassReverse /api/ http://127.0.0.1:8000/api/

    # Sitio y API públicos sin autenticación básica.

    ErrorLog ${APACHE_LOG_DIR}/smarthome-error.log
    CustomLog ${APACHE_LOG_DIR}/smarthome-access.log combined
</VirtualHost>
