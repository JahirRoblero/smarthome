# SmartHome: sitio HTTP inicial para Certbot. Certbot añadirá TLS en :443.
# Servimos el build de React, NO el servidor Vite de desarrollo.
# El backend está ligado a 127.0.0.1:8000 por Docker Compose.
#
# Antes de habilitar este archivo:
# sudo htpasswd -c /etc/nginx/.smarthome-htpasswd smarthomeadmin
# sudo rsync -a --delete frontend/dist/ /var/www/smarthome/
server {
    listen 80;
    server_name smarthome.votaya.com.mx;

    root /var/www/smarthome;
    index index.html;
    server_tokens off;
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Certbot puede colocar su challenge bajo /.well-known sin autenticación.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        try_files $uri =404;
    }

    # Se protege la API porque ENVIAR CORREO no requiere login en SmartHome.
    location /api/ {
        auth_basic "SmartHome - acceso restringido";
        auth_basic_user_file /etc/nginx/.smarthome-htpasswd;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        auth_basic "SmartHome - acceso restringido";
        auth_basic_user_file /etc/nginx/.smarthome-htpasswd;

        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
