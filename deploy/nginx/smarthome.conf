# SmartHome: sitio HTTP inicial para Certbot. Certbot añadirá TLS en :443.
# Servimos el build de React, NO el servidor Vite de desarrollo.
# El backend está ligado a 127.0.0.1:8000 por Docker Compose.
#
# Para publicar el build:
# sudo rsync -a --delete frontend/dist/ /var/www/smarthome/
server {
    listen 80;
    server_name smarthome.votaya.com.mx;

    root /var/www/smarthome;
    index index.html;
    server_tokens off;
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # Certbot puede colocar su challenge bajo /.well-known.
    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    # API pública, sin inicio de sesión ni límites por IP.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
